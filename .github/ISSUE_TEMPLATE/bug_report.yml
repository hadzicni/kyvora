name: Bug report
description: Report a reproducible problem in Kyvora.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail so we can reproduce and investigate it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Start Kyvora with ...
        2. Open ...
        3. Click ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web dashboard
        - API
        - Agent
        - Infrastructure
        - Documentation
        - CI/CD
        - Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Kyvora version, branch, or commit SHA.
      placeholder: main / v0.1.0 / commit SHA

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node, Java, Go, Docker, database version, etc.
      placeholder: |
        OS:
        Browser:
        Node:
        Java:
        Go:
        Docker:
        PostgreSQL:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant logs, stack traces, or screenshots. Remove secrets before posting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues.
          required: true
        - label: I have removed secrets, tokens, passwords, and private infrastructure details from this report.
          required: true
