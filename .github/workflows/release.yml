name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            git fetch --tags --force
            git checkout "$tag"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            git fetch --tags --force
            git checkout "$tag"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0. Found: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"

          if [ "$version" != "$file_version" ]; then
            echo "Tag $tag does not match VERSION $file_version." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release metadata
        run: npm run release:check

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes_file="release-notes.md"

          awk -v version="$version" '
            $0 ~ "^## \\[?" version "\\]?([[:space:]]|$)" { found=1; next }
            found && $0 ~ "^## " { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "No changelog notes found for $version." >&2
            exit 1
          fi

          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test API
        run: gradle -p apps/api test

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint -w apps/web

      - name: Build web
        run: npm run build -w apps/web

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: apps/agent/go.sum

      - name: Test agent
        working-directory: apps/agent
        run: go test ./...

      - name: Build agent release binaries
        env:
          KYVORA_AGENT_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-agent.sh

      - name: Create GitHub Release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Kyvora ${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            apps/agent/dist/kyvora-agent-linux-amd64 \
            apps/agent/dist/kyvora-agent-linux-arm64 \
            apps/agent/dist/checksums.txt

      - name: Upload agent assets to existing release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            apps/agent/dist/kyvora-agent-linux-amd64 \
            apps/agent/dist/kyvora-agent-linux-arm64 \
            apps/agent/dist/checksums.txt \
            --clobber
