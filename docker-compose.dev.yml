services:
  postgres:
    image: postgres:17-alpine
    container_name: kyvora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kyvora
      POSTGRES_USER: kyvora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - kyvora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyvora -d kyvora"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kyvora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      KYVORA_JWT_SECRET: ${KYVORA_JWT_SECRET}
      KYVORA_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kyvora
      KYVORA_DATASOURCE_USERNAME: kyvora
      KYVORA_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kyvora-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KYVORA_API_URL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  kyvora-postgres-data:
