services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kyvora}
      POSTGRES_USER: ${POSTGRES_USER:-kyvora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KYVORA_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kyvora}
      KYVORA_DATASOURCE_USERNAME: ${POSTGRES_USER:-kyvora}
      KYVORA_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KYVORA_JWT_SECRET: ${KYVORA_JWT_SECRET:?KYVORA_JWT_SECRET must be set}
      KYVORA_BOOTSTRAP_ADMIN_EMAIL: ${KYVORA_BOOTSTRAP_ADMIN_EMAIL:?KYVORA_BOOTSTRAP_ADMIN_EMAIL must be set}
      KYVORA_BOOTSTRAP_ADMIN_PASSWORD: ${KYVORA_BOOTSTRAP_ADMIN_PASSWORD:?KYVORA_BOOTSTRAP_ADMIN_PASSWORD must be set}
      KYVORA_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${KYVORA_BOOTSTRAP_ADMIN_DISPLAY_NAME:?KYVORA_BOOTSTRAP_ADMIN_DISPLAY_NAME must be set}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      KYVORA_API_URL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  postgres-data:
