<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kyvora Icon</title>
  <desc id="desc">A transparent Kyvora logo mark combining a geometric K with infrastructure nodes and control-plane connections.</desc>

  <!-- Transparent background by design: no background shape -->

  <!-- Control-plane connection lines -->
  <path
    d="M128 144H220M128 368H220M304 256H392M222 144L304 256L222 368"
    stroke="url(#line-gradient)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Main geometric K stem -->
  <path
    d="M126 112C126 103.163 133.163 96 142 96H176C184.837 96 192 103.163 192 112V400C192 408.837 184.837 416 176 416H142C133.163 416 126 408.837 126 400V112Z"
    fill="url(#stem-gradient)"
  />

  <!-- K upper arm -->
  <path
    d="M190 246L313.845 103.736C317.644 99.3712 323.148 96.8662 328.934 96.8662H376.215C390.031 96.8662 397.341 113.202 388.145 123.509L262 265L190 246Z"
    fill="url(#upper-gradient)"
  />

  <!-- K lower arm -->
  <path
    d="M230 236L392.675 388.228C403.278 398.151 396.258 416 381.735 416H331.678C326.496 416 321.516 413.988 317.789 410.39L190 287L230 236Z"
    fill="url(#lower-gradient)"
  />

  <!-- Negative-cut style inner separator -->
  <path
    d="M190 246L232 236L262 265L190 287V246Z"
    fill="#020617"
    fill-opacity="0.72"
  />

  <!-- Network nodes -->
  <circle cx="128" cy="144" r="24" fill="url(#node-primary)" />
  <circle cx="128" cy="368" r="24" fill="url(#node-primary)" />
  <circle cx="392" cy="256" r="24" fill="url(#node-accent)" />
  <circle cx="304" cy="256" r="17" fill="#E0F2FE" />

  <!-- Node inner highlights -->
  <circle cx="128" cy="144" r="9" fill="#F8FAFC" fill-opacity="0.92" />
  <circle cx="128" cy="368" r="9" fill="#F8FAFC" fill-opacity="0.92" />
  <circle cx="392" cy="256" r="9" fill="#F8FAFC" fill-opacity="0.92" />
  <circle cx="304" cy="256" r="6" fill="#0F172A" fill-opacity="0.55" />

  <!-- Small modular blocks -->
  <rect x="274" y="116" width="36" height="36" rx="10" transform="rotate(45 274 116)" fill="#38BDF8" fill-opacity="0.22" />
  <rect x="274" y="360" width="36" height="36" rx="10" transform="rotate(45 274 360)" fill="#8B5CF6" fill-opacity="0.24" />
  <rect x="352" y="218" width="28" height="28" rx="8" transform="rotate(45 352 218)" fill="#6366F1" fill-opacity="0.28" />

  <defs>
    <linearGradient id="stem-gradient" x1="126" y1="96" x2="205" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="upper-gradient" x1="192" y1="96" x2="386" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FE"/>
      <stop offset="0.48" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="lower-gradient" x1="190" y1="236" x2="398" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7D2FE"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="line-gradient" x1="112" y1="144" x2="408" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.36"/>
    </linearGradient>

    <linearGradient id="node-primary" x1="104" y1="120" x2="152" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="node-accent" x1="368" y1="232" x2="416" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
</svg>
